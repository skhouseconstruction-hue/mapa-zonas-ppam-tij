<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#173b70">
<title>PPAM-TIJ | Mapa de zonas y territorios</title>
<style>
:root{color-scheme:light;--navy:#173b70;--blue:#2468b8;--green:#17965b;--orange:#dc842e;--ink:#152d50;--muted:#64748b;--line:#e2e8f0}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#f5f8fc}
.ppam-shell{width:100%;padding:12px;background:#fff;border:1px solid #e2e8f0;border-radius:16px;box-shadow:0 3px 14px #173b7012}
.ppam-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;color:#fff;background:linear-gradient(115deg,#173b70,#102e5b);border-radius:11px}
.ppam-brand{display:flex;align-items:center;gap:14px;min-width:0}
.ppam-brand-icon{width:54px;height:54px;flex:none}
.ppam-title{font-size:clamp(20px,3vw,30px);font-weight:800;line-height:1.05;letter-spacing:.2px}
.ppam-subtitle{font-size:clamp(13px,1.8vw,18px);margin-top:5px;opacity:.94}
.ppam-tag{flex:none;padding:10px 17px;border-radius:24px;background:#2474c9;font-size:clamp(12px,1.7vw,17px);font-weight:700}
.ppam-main{display:block;margin-top:14px}
.ppam-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ppam-stat{display:flex;align-items:center;gap:14px;padding:15px;border:1px solid var(--line);border-radius:13px;background:#f9fbfe;min-width:0}
.ppam-stat-icon{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;flex:none;background:#eaf2ff;color:var(--blue)}
.ppam-stat:nth-child(2) .ppam-stat-icon{background:#e8f7ef;color:var(--green)}
.ppam-stat:nth-child(3) .ppam-stat-icon{background:#fff3e6;color:var(--orange)}
.ppam-stat-icon svg{width:32px;height:32px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.ppam-stat-label{font-size:16px;font-weight:700;color:#243a5a}
.ppam-stat-value{font-size:clamp(27px,3vw,38px);font-weight:800;line-height:1.05;color:var(--blue);font-variant-numeric:tabular-nums}
.ppam-stat:nth-child(2) .ppam-stat-value{color:var(--green)}
.ppam-stat:nth-child(3) .ppam-stat-value{color:var(--orange)}
.ppam-map{min-width:0;min-height:340px;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#e9f0f7;position:relative}
.ppam-map{margin-top:14px;min-height:0;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff}
.ppam-map img{display:block;width:100%;height:auto;object-fit:contain;background:#fff}
.ppam-map-stage{position:relative;width:100%;line-height:0}
.ppam-pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.ppam-pin{position:absolute;transform:translate(-50%,-100%);width:24px;height:32px;padding:0;border:0;background:transparent;pointer-events:auto;cursor:pointer;line-height:1;filter:drop-shadow(0 0 4px #ff2bd6)}
.ppam-pin:before{content:"";position:absolute;left:4px;top:1px;width:16px;height:16px;border:3px solid #f7fff0;border-radius:50% 50% 50% 0;background:#ff2bd6;box-shadow:0 0 7px #ff2bd6,0 0 15px #ff2bd6,0 0 25px #ff2bd6;transform:rotate(-45deg)}
.ppam-pin:after{content:"";position:absolute;left:10px;top:7px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 5px #fff}
.ppam-pin span{position:absolute;left:50%;bottom:31px;transform:translateX(-50%);display:none;white-space:nowrap;max-width:190px;overflow:hidden;text-overflow:ellipsis;padding:5px 8px;border-radius:7px;background:#102e5b;color:#fff;font:700 11px Arial,sans-serif;line-height:1.2;box-shadow:0 2px 9px #0004}
.ppam-pin:focus-visible span,.ppam-pin:hover span{display:block}
.ppam-pin:focus-visible{outline:2px solid #102e5b;outline-offset:4px;border-radius:50%}
.ppam-pin.pulse{animation:ppamPinPulse 2s infinite}
@keyframes ppamPinPulse{0%,100%{filter:drop-shadow(0 0 3px #ff2bd6)}50%{filter:drop-shadow(0 0 10px #ff2bd6) drop-shadow(0 0 16px #ff2bd6)}}
@media(prefers-reduced-motion:reduce){.ppam-pin.pulse{animation:none}}
.ppam-info{display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px 17px;border-radius:10px;background:#eaf2fc;color:#19365e;font-size:clamp(13px,1.7vw,17px);line-height:1.4}
.ppam-info-icon{display:grid;place-items:center;width:32px;height:32px;flex:none;border-radius:50%;background:#2474c9;color:#fff;font-weight:800;font-size:20px}
.ppam-foot{display:flex;justify-content:flex-end;gap:12px;align-items:center;padding:9px 2px 0;color:#64748b;font-size:11px}
.ppam-foot a{color:#1f5fae;text-decoration:none;font-weight:700}
@media(max-width:700px){
 .ppam-shell{padding:8px;border-radius:12px}
 .ppam-head{padding:13px 12px;gap:8px}
 .ppam-brand{gap:9px}
 .ppam-brand-icon{width:42px;height:42px}
 .ppam-tag{padding:8px 10px;font-size:11px;white-space:nowrap}
 .ppam-main{display:block;margin-top:10px}
 .ppam-stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
 .ppam-stat{display:flex;flex-direction:column;justify-content:center;text-align:center;gap:5px;padding:9px 4px;min-height:100px}
 .ppam-stat-icon{width:38px;height:38px}
 .ppam-stat-icon svg{width:23px;height:23px}
 .ppam-stat-label{font-size:12px}
 .ppam-stat-value{font-size:25px}
 .ppam-info{padding:11px;font-size:13px}
}
</style>
</head>
<body>
<section class="ppam-shell" aria-label="Resumen del mapa PPAM-TIJ">
 <header class="ppam-head">
  <div class="ppam-brand">
   <svg class="ppam-brand-icon" viewBox="0 0 64 64" aria-hidden="true"><path d="M7 18 23 9l18 8 16-8v37l-16 9-18-8-16 8z" fill="none" stroke="white" stroke-width="3" stroke-linejoin="round"/><path d="M23 9v38M41 17v38" fill="none" stroke="white" stroke-width="3"/><path d="M32 8c-7 0-12 5-12 12 0 9 12 20 12 20s12-11 12-20C44 13 39 8 32 8z" fill="#fff"/><circle cx="32" cy="20" r="4" fill="#173b70"/></svg>
   <div><div class="ppam-title">PPAM-TIJ</div><div class="ppam-subtitle">Mapa de zonas y territorios</div></div>
  </div>
  <div class="ppam-tag">Territorios de <u style="text-underline-offset:3px;text-decoration-thickness:2px;">Tijuana</u></div>
 </header>
 <div class="ppam-main">
  <div class="ppam-stats">
   <div class="ppam-stat"><div class="ppam-stat-icon"><svg viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15m6-12v15"/></svg></div><div><div class="ppam-stat-label">Zonas</div><div class="ppam-stat-value" id="ppam-zones">—</div></div></div>
   <div class="ppam-stat"><div class="ppam-stat-icon"><svg viewBox="0 0 24 24"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg></div><div><div class="ppam-stat-label">Resguardo de exhibidores</div><div class="ppam-stat-value" id="ppam-locations">—</div></div></div>
   <div class="ppam-stat"><div class="ppam-stat-icon"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></div><div><div class="ppam-stat-label">Eventos</div><div class="ppam-stat-value" id="ppam-events">—</div></div></div>
  </div>

  <div class="ppam-map" aria-label="Mapa ilustrado de Tijuana con ubicaciones registradas">
   <div class="ppam-map-stage">
    <img src="./mapa-tijuana-1200-q78.webp" alt="Mapa de Tijuana, Baja California, dividido en zonas de colores pastel" loading="eager" decoding="async">
    <div class="ppam-pins" id="ppam-pins" aria-live="polite"></div>
   </div>
  </div>
 </div>
 <div class="ppam-info"><span class="ppam-info-icon">i</span><span><strong>Consulta las zonas, ubicaciones y eventos</strong> registrados en PPAM-TIJ.</span></div>
 <div class="ppam-foot"><span id="ppam-status">Consultando datos publicados…</span><a href="./safi.html" target="_blank" rel="noopener">Abrir mapa completo ↗</a></div>
</section>
<script>
(function(){
 'use strict';
 const DATA_URL='./data.json';
 const bounds={minLat:32.32,maxLat:32.59,minLng:-117.15,maxLng:-116.80};
 function validCoords(item){
  if(!item||item.lat===null||item.lng===null||item.lat===undefined||item.lng===undefined||String(item.lat).trim()===''||String(item.lng).trim()==='')return false;
  const lat=Number(item.lat),lng=Number(item.lng);
  return Number.isFinite(lat)&&Number.isFinite(lng)&&lat>=bounds.minLat&&lat<=bounds.maxLat&&lng>=bounds.minLng&&lng<=bounds.maxLng;
 }
 function makePin(item,type){
  const lat=Number(item.lat),lng=Number(item.lng);
  const x=((lng-bounds.minLng)/(bounds.maxLng-bounds.minLng))*100;
  const y=((bounds.maxLat-lat)/(bounds.maxLat-bounds.minLat))*100;
  const pin=document.createElement('button');
  pin.type='button';pin.className='ppam-pin pulse';
  pin.style.left=x+'%';pin.style.top=y+'%';
  pin.title=(item.name||'Ubicación')+' · '+type;
  pin.setAttribute('aria-label',(item.name||'Ubicación')+' · '+type);
  const label=document.createElement('span');label.textContent=item.name||type;
  pin.appendChild(label);
  pin.addEventListener('click',()=>{label.style.display='block';});
  return pin;
 }
 function renderPins(data){
  const layer=document.getElementById('ppam-pins');
  if(!layer)return;
  const records=[
   ...(Array.isArray(data.points)?data.points.map(x=>({...x,_type:'Zona'})):[]),
   ...(Array.isArray(data.shelters)?data.shelters.map(x=>({...x,_type:'Resguardo'})):[]),
   ...(Array.isArray(data.events)?data.events.map(x=>({...x,_type:'Evento'})):[]
  ];
  layer.replaceChildren();
  records.filter(validCoords).forEach(item=>layer.appendChild(makePin(item,item._type)));
 }
 async function updatePanel(){
  const status=document.getElementById('ppam-status');
  try{
   let response=await fetch(DATA_URL+'?v='+Date.now(),{cache:'no-store'});
   if(!response.ok){
    response=await fetch('https://raw.githubusercontent.com/skhouseconstruction-hue/mapa-zonas-ppam-tij/main/data.json?v='+Date.now(),{cache:'no-store'});
   }
   if(!response.ok)throw new Error('No se pudo leer data.json ('+response.status+').');
   const data=await response.json();
   const points=Array.isArray(data.points)?data.points:[];
   const shelters=Array.isArray(data.shelters)?data.shelters:[];
   const events=Array.isArray(data.events)?data.events:[];
   const locations=[...points,...shelters].filter(validCoords).length;
   document.getElementById('ppam-zones').textContent=String(points.length);
   document.getElementById('ppam-locations').textContent=String(locations);
   document.getElementById('ppam-events').textContent=String(events.length);
   renderPins({...data,points,shelters,events});
   status.textContent='Datos actualizados · '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  }catch(error){
   status.textContent='No se pudieron cargar las ubicaciones: '+(error&&error.message?error.message:'error de conexión');
  }
 }
 updatePanel();
 setInterval(updatePanel,15000);
})();
</script>
</body>
</html>
